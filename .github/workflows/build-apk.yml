name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          unzip -q -o voice-life-project.zip
          ls voice-life

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true
          cache-dependency-path: voice-life/pubspec.yaml

      - name: Install dependencies
        working-directory: voice-life
        run: flutter pub get

      - name: Analyze (does not block the build)
        working-directory: voice-life
        run: flutter analyze
        continue-on-error: true

      - name: Unit tests (does not block the build)
        working-directory: voice-life
        run: flutter test
        continue-on-error: true

      - name: Build debug APK
        working-directory: voice-life
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: voice-life-debug-apk
          path: voice-life/build/app/outputs/flutter-apk/app-debug.apk
